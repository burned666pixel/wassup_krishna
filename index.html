:root {
    --primary: #5a3e2b;
    --dark: #2b1e16;
    --light: #f5f1eb;
    --card: #ffffff;
    --gray: #6b5b4d;
    --gold: #b08d57;
}

/* Dark Mode */
body.dark-mode {
    --primary: #b08d57;
    --dark: #f5f1eb;
    --light: #1a120c;
    --card: #2b1e16;
    --gray: #cbb9a6;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: var(--light);
    color: var(--dark);
    line-height: 1.7;
    transition: 0.3s ease;
}

/* NAVIGATION */
nav {
    position: fixed;
    width: 100%;
    top: 0;
    background: rgba(245,241,235,0.95);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    padding: 15px 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(43,30,22,0.05);
}

nav ul {
    list-style: none;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    text-decoration: none;
    color: var(--dark);
    font-weight: 500;
    transition: 0.3s;
}

nav a:hover {
    color: var(--gold);
}

.toggle-btn {
    position: absolute;
    right: 25px;
    cursor: pointer;
    background: var(--primary);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
}

/* HERO */
.hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #2b1e16, #5a3e2b);
    color: var(--light);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.hero h1 { font-size: 3rem; }
.hero h2 { margin: 15px 0; color: #e8dccb; }

.cta-btn {
    margin-top: 25px;
    background: var(--gold);
    color: #2b1e16;
    padding: 12px 28px;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    transition: 0.3s;
}

.cta-btn:hover {
    background: #d4af37;
}

/* SECTION */
.section {
    padding: 100px 20px;
    max-width: 1100px;
    margin: auto;
}

.section h2 {
    text-align: center;
    margin-bottom: 40px;
    color: var(--primary);
}

/* CARDS */
.card {
    background: var(--card);
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(43,30,22,0.08);
    margin-bottom: 25px;
}

/* SKILLS */
.skills-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.progress {
    background: #e6ded6;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 8px;
    background: var(--primary);
    width: 0;
    transition: width 1.5s ease;
}

    position: relative;
    padding-left: 30px;
}

    content: '';
    position: absolute;
    left: 12px;
    width: 3px;
    height: 100%;
    background: var(--primary);
}
